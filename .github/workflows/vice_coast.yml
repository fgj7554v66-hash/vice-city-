name: Build Vice Coast for iPhone

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix Godot export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -R /root/.local/share/godot/export_templates/4.7.2.stable "$HOME/.local/share/godot/export_templates/4.7.2.stable"
      - name: Unpack game
        run: |
          rm -rf game
          mkdir -p game
          unzip -q VICE_COAST_GODOT_IPHONE.zip -d game

      - name: Make clean Web export settings
        run: |
          cat > game/export_presets.cfg <<'EOF'
          [preset.0]

          name="Web"
          platform="Web"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/web/index.html"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          variant/extensions_support=false
          variant/thread_support=false
          vram_texture_compression/for_desktop=true
          vram_texture_compression/for_mobile=false
          html/export_icon=true
          html/custom_html_shell=""
          html/head_include=""
          html/canvas_resize_policy=2
          html/focus_canvas_on_start=true
          html/experimental_virtual_keyboard=false
          progressive_web_app/enabled=false
          progressive_web_app/ensure_cross_origin_isolation_headers=false
          progressive_web_app/offline_page=""
          progressive_web_app/display=1
          progressive_web_app/orientation=0
          progressive_web_app/icon_144x144=""
          progressive_web_app/icon_180x180=""
          progressive_web_app/icon_512x512=""
          progressive_web_app/background_color=Color(0, 0, 0, 1)
          EOF

      - name: Check Godot
        run: |
          godot --version
          ls -la game
          ls -la /root/.local/share/godot/export_templates/4.7.2.stable

      - name: Import project
        run: |
          godot --headless --path game --editor --quit

      - name: Export web game
        run: |
          mkdir -p game/build/web
          godot --headless --verbose --path game --export-release "Web" build/web/index.html
          touch game/build/web/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload game
        uses: actions/upload-pages-artifact@v3
        with:
          path: game/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
