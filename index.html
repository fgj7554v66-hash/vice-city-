<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06101b;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:#75bde8;touch-action:none}#start{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:28px;background:radial-gradient(circle at 72% 24%,rgba(255,114,72,.32),transparent 34%),radial-gradient(circle at 18% 72%,rgba(34,142,215,.18),transparent 38%),linear-gradient(155deg,#071321,#17121b 58%,#06090e)}#start h1{font-size:clamp(48px,14vw,86px);line-height:.87;margin:0;font-weight:950;letter-spacing:.08em;text-shadow:0 14px 38px rgba(0,0,0,.45)}#start h1 small{display:block;font-size:.23em;letter-spacing:.5em;margin:18px 0 0 .5em;opacity:.78}#start p{max-width:430px;margin:24px 0 20px;opacity:.76;font-size:14px;line-height:1.5}#play{appearance:none;-webkit-appearance:none;border:0;padding:16px 34px;border-radius:999px;background:#fff;color:#0a1017;font-size:17px;font-weight:950;touch-action:manipulation;box-shadow:0 12px 35px rgba(0,0,0,.28)}#status{min-height:18px;margin-top:14px;font-size:12px;opacity:.58}#hud{display:none;position:fixed;inset:0;z-index:20;pointer-events:none;color:white;text-shadow:0 2px 7px rgba(0,0,0,.78)}#brand{position:absolute;left:14px;top:calc(env(safe-area-inset-top) + 10px);font-size:12px;font-weight:900;letter-spacing:.22em}#stats{position:absolute;right:14px;top:calc(env(safe-area-inset-top) + 9px);display:flex;gap:7px}.pill{padding:8px 10px;border-radius:12px;background:rgba(4,8,13,.42);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(8px);font-size:12px;font-weight:850}#cross{position:absolute;left:50%;top:47%;width:16px;height:16px;transform:translate(-50%,-50%)}#cross:before,#cross:after{content:"";position:absolute;background:#fff;border-radius:2px;box-shadow:0 0 4px rgba(0,0,0,.65)}#cross:before{left:0;top:7px;width:16px;height:2px}#cross:after{left:7px;top:0;width:2px;height:16px}#look{position:absolute;right:0;top:0;width:58%;height:100%;pointer-events:auto}#joy{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:calc(env(safe-area-inset-bottom) + 26px);width:124px;height:124px;border-radius:50%;pointer-events:auto;border:1px solid rgba(255,255,255,.17);background:rgba(255,255,255,.06);backdrop-filter:blur(5px)}#stick{position:absolute;left:36px;top:36px;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.24);border:1px solid rgba(255,255,255,.35);box-shadow:0 6px 18px rgba(0,0,0,.2)}.btn{position:absolute;pointer-events:auto;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(4,8,13,.46);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(7px);font-size:11px;font-weight:900;box-shadow:0 7px 22px rgba(0,0,0,.2)}.btn:active{transform:scale(.94);background:rgba(255,255,255,.15)}#fire{right:max(18px,env(safe-area-inset-right));bottom:calc(env(safe-area-inset-bottom) + 27px);width:78px;height:78px}#jump{right:max(28px,env(safe-area-inset-right));bottom:calc(env(safe-area-inset-bottom) + 121px);width:60px;height:60px}#run{right:max(108px,calc(env(safe-area-inset-right) + 91px));bottom:calc(env(safe-area-inset-bottom) + 44px);width:56px;height:56px;font-size:10px}#reload{right:max(111px,calc(env(safe-area-inset-right) + 94px));bottom:calc(env(safe-area-inset-bottom) + 115px);width:48px;height:48px;font-size:9px}#view{right:max(15px,env(safe-area-inset-right));top:calc(env(safe-area-inset-top) + 57px);width:46px;height:46px;font-size:9px}#toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 171px);transform:translateX(-50%);padding:8px 12px;border-radius:10px;background:rgba(0,0,0,.43);font-size:11px;opacity:0;transition:opacity .15s}#fps{position:absolute;left:14px;top:calc(env(safe-area-inset-top) + 34px);font-size:9px;opacity:.48}@media(orientation:portrait){#start:after{content:"Rotate your iPhone sideways for the best view.";font-size:12px;opacity:.55;margin-top:18px}#joy{width:112px;height:112px}#stick{left:30px;top:30px}#fire{width:70px;height:70px}}

</head><body>
<canvas id="game"></canvas>
<div id="start"><h1>VICE<br>COAST<small>MOBILE</small></h1><p>This build uses a phone-safe Canvas renderer instead of the WebGL shader that failed on your iPhone. It is a lightweight original open-world prototype.</p><button id="play" type="button">START GAME</button><div id="status">Ready — no WebGL required.</div></div>
<div id="hud"><div id="brand">VICE COAST</div><div id="fps"></div><div id="stats"><div class="pill">HP <span id="hp">100</span></div><div class="pill">AMMO <span id="ammo">24</span> / ∞</div></div><div id="cross"></div><div id="look"></div><div id="joy"><div id="stick"></div></div><div id="fire" class="btn">FIRE</div><div id="jump" class="btn">JUMP</div><div id="run" class="btn">SPRINT</div><div id="reload" class="btn">RELOAD</div><div id="view" class="btn">VIEW</div><div id="toast"></div></div>
<script>
(()=>{"use strict";
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false});
const start=document.getElementById('start'),play=document.getElementById('play'),status=document.getElementById('status'),hud=document.getElementById('hud'),ammoEl=document.getElementById('ammo'),toast=document.getElementById('toast'),fpsEl=document.getElementById('fps');
let W=0,H=0,DPR=1,F=700,horizon=0,started=false,last=0,time=0,frameCount=0,fpsTime=0;
let player={x:-18,y:1.0,z:34,yaw:0,pitch:-.03,vy:0,grounded:true,ammo:24,recoil:0};
let moveX=0,moveY=0,sprinting=false,firstPerson=false,fireCd=0;
const buildings=[],palms=[],cars=[],umbrellas=[];
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function rand(a,b){return a+Math.random()*(b-a)}function pick(a){return a[(Math.random()*a.length)|0]}
function shade(hex,f){let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);r=clamp(r*f,0,255)|0;g=clamp(g*f,0,255)|0;b=clamp(b*f,0,255)|0;return `rgb(${r},${g},${b})`}
function toastMsg(s){toast.textContent=s;toast.style.opacity='1';clearTimeout(toastMsg.t);toastMsg.t=setTimeout(()=>toast.style.opacity='0',900)}
function resize(){DPR=Math.min(devicePixelRatio||1,1.45);W=innerWidth;H=innerHeight;canvas.width=Math.max(1,(W*DPR)|0);canvas.height=Math.max(1,(H*DPR)|0);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);F=Math.max(430,Math.min(900,W*.92));horizon=H*.42}window.addEventListener('resize',resize);resize();
function initWorld(){buildings.length=palms.length=cars.length=umbrellas.length=0;const pal=['#d3cabd','#aab7c2','#c5b4a6','#949da5','#ddd4c7','#b4c4b9','#aeb3b8'];for(let gx=20;gx<=420;gx+=80){for(let gz=-440;gz<=40;gz+=80){if(Math.random()<.1)continue;let w=rand(28,48),d=rand(28,48),h=rand(18,gx>150?70:42);if(gx>250&&Math.random()>.58)h=rand(68,120);buildings.push({x:gx+rand(-4,4),z:gz+rand(-4,4),w,d,h,c:pick(pal),glass:Math.random()>.35})}}buildings.push({x:350,z:-210,w:42,d:42,h:140,c:'#bfc8cf',glass:true},{x:270,z:-365,w:48,d:36,h:112,c:'#aebfca',glass:true},{x:194,z:-276,w:40,d:46,h:96,c:'#d2cbc3',glass:true});for(let z=-460;z<110;z+=20){palms.push({x:-70+rand(-4,4),z:z+rand(-5,5),s:rand(.8,1.18)});if(Math.random()>.37)palms.push({x:-125+rand(-22,18),z:z+rand(-9,9),s:rand(.7,1.03)})}for(let z=-390;z<70;z+=58)if(Math.random()>.22)umbrellas.push({x:-145+rand(-32,16),z:z+rand(-8,8),c:pick(['#f1ece4','#e5665d','#e9ca55','#5ba5ca'])});for(let i=0;i<14;i++)cars.push({x:pick([70,150,230,310]),z:rand(-470,90),dir:Math.random()>.5?1:-1,s:rand(8,14),c:pick(['#c94141','#e6e6e6','#20252a','#3b67a3','#cd8a35','#617567'])})}
function camPoint(x,y,z){let dx=x-player.x,dy=y-(player.y+1.55),dz=z-player.z;const sy=Math.sin(player.yaw),cy=Math.cos(player.yaw);let rx=dx*cy-dz*sy,rz=dx*sy+dz*cy;const sp=Math.sin(player.pitch),cp=Math.cos(player.pitch);let ry=dy*cp-rz*sp,rz2=dy*sp+rz*cp;return{x:rx,y:ry,z:rz2}}
function proj(x,y,z){const p=camPoint(x,y,z);if(p.z<.35)return null;return{x:W/2+p.x/p.z*F,y:horizon-p.y/p.z*F,z:p.z}}
function poly(points,fill,stroke){if(points.some(p=>!p))return;ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);for(let i=1;i<points.length;i++)ctx.lineTo(points[i].x,points[i].y);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
function groundKind(x,z){if(x<-120)return'ocean';if(x<-55)return'beach';if(x>-62&&x<-48)return'walk';if(Math.abs(x+22)<15)return'road';for(let gx=-22;gx<=420;gx+=80)if(Math.abs(x-gx)<12)return'road';for(let gz=-460;gz<=100;gz+=80)if(Math.abs(z-gz)<12)return'road';return x>-55?'city':'beach'}
function drawBackground(){let g=ctx.createLinearGradient(0,0,0,horizon+40);g.addColorStop(0,'#64a9df');g.addColorStop(.58,'#92cde8');g.addColorStop(1,'#f2b07d');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);const sx=W*.22+Math.sin(player.yaw*.4)*W*.12,sy=horizon*.40;const rg=ctx.createRadialGradient(sx,sy,5,sx,sy,50);rg.addColorStop(0,'rgba(255,244,193,.95)');rg.addColorStop(.28,'rgba(255,206,128,.58)');rg.addColorStop(1,'rgba(255,190,95,0)');ctx.fillStyle=rg;ctx.beginPath();ctx.arc(sx,sy,55,0,Math.PI*2);ctx.fill();}
function drawGround(){const tiles=[],step=28,range=420;let sx=Math.floor((player.x-range)/step)*step,ex=Math.floor((player.x+range)/step)*step,sz=Math.floor((player.z-range)/step)*step,ez=Math.floor((player.z+range)/step)*step;for(let x=sx;x<=ex;x+=step)for(let z=sz;z<=ez;z+=step){const c=camPoint(x+step/2,0,z+step/2);if(c.z<.2||c.z>560)continue;tiles.push({x,z,d:c.z,k:groundKind(x+step/2,z+step/2)})}tiles.sort((a,b)=>b.d-a.d);for(const t of tiles){const p1=proj(t.x,0,t.z),p2=proj(t.x+step,0,t.z),p3=proj(t.x+step,0,t.z+step),p4=proj(t.x,0,t.z+step);if(!p1||!p2||!p3||!p4)continue;let col='#617a4f';if(t.k==='road')col='#303338';else if(t.k==='beach')col='#d5bb80';else if(t.k==='walk')col='#918f89';else if(t.k==='ocean'){let wave=(Math.sin(t.x*.07+t.z*.05+time*1.6)+1)*.5;col=`rgb(${18+wave*10|0},${107+wave*20|0},${145+wave*24|0})`}poly([p1,p2,p3,p4],col);if(t.k==='ocean'&&Math.sin(t.x*.12+t.z*.08+time*2)>0.75){ctx.strokeStyle='rgba(210,245,255,.28)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke()}}
 // lane markers
 ctx.fillStyle='rgba(247,218,119,.9)';for(let gx=-22;gx<=420;gx+=80)for(let z=-450;z<100;z+=18){let a=proj(gx-.35,.02,z),b=proj(gx+.35,.02,z),c=proj(gx+.35,.02,z+7),d=proj(gx-.35,.02,z+7);if(a&&b&&c&&d)poly([a,b,c,d],'rgba(247,218,119,.85)')}for(let gz=-460;gz<=100;gz+=80)for(let x=-20;x<430;x+=18){let a=proj(x,.02,gz-.35),b=proj(x+7,.02,gz-.35),c=proj(x+7,.02,gz+.35),d=proj(x,.02,gz+.35);if(a&&b&&c&&d)poly([a,b,c,d],'rgba(247,218,119,.85)')}}
function boxFaces(o){const x=o.x,z=o.z,w=o.w/2,d=o.d/2,h=o.h;const pts=[[x-w,0,z-d],[x+w,0,z-d],[x+w,0,z+d],[x-w,0,z+d],[x-w,h,z-d],[x+w,h,z-d],[x+w,h,z+d],[x-w,h,z+d]].map(q=>proj(...q));const faces=[{i:[0,1,5,4],f:.70},{i:[1,2,6,5],f:.82},{i:[2,3,7,6],f:.63},{i:[3,0,4,7],f:.74},{i:[4,5,6,7],f:1.04}];const out=[];for(const f of faces){const pp=f.i.map(i=>pts[i]);if(pp.some(p=>!p))continue;let area=0;for(let i=0;i<4;i++){let a=pp[i],b=pp[(i+1)%4];area+=a.x*b.y-b.x*a.y}if(area>0)continue;out.push({pp,f:f.f,d:pp.reduce((s,p)=>s+p.z,0)/4})}return out}
function drawBuilding(o){const c=camPoint(o.x,o.h*.5,o.z);if(c.z<1||c.z>520)return;const faces=boxFaces(o).sort((a,b)=>b.d-a.d);for(const f of faces){poly(f.pp,shade(o.c,f.f),'rgba(20,30,38,.18)');if(o.glass&&f.pp.length===4&&f.f<1){const [a,b,c2,d]=f.pp;const heightPx=Math.abs(a.y-d.y);if(heightPx>20){ctx.strokeStyle='rgba(84,136,166,.48)';ctx.lineWidth=Math.max(.6,Math.min(2,heightPx/80));let rows=Math.min(9,Math.max(2,(heightPx/16)|0));for(let r=1;r<rows;r++){let t=r/rows;ctx.beginPath();ctx.moveTo(a.x+(d.x-a.x)*t,a.y+(d.y-a.y)*t);ctx.lineTo(b.x+(c2.x-b.x)*t,b.y+(c2.y-b.y)*t);ctx.stroke()}}}}
}
function drawPalm(p){const b=proj(p.x,0,p.z),t=proj(p.x,8*p.s,p.z);if(!b||!t||b.z>470)return;ctx.strokeStyle='#6d4b2f';ctx.lineWidth=clamp(32/b.z,1.3,7);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(t.x,t.y);ctx.stroke();ctx.strokeStyle='#26713f';ctx.lineWidth=clamp(22/b.z,1,5);for(let i=0;i<7;i++){let a=i*Math.PI*2/7;let e=proj(p.x+Math.sin(a)*4.6*p.s,7.2*p.s,p.z+Math.cos(a)*4.6*p.s);if(!e)continue;ctx.beginPath();ctx.moveTo(t.x,t.y);ctx.quadraticCurveTo((t.x+e.x)/2,t.y-6,e.x,e.y);ctx.stroke()}}
function drawUmbrella(u){const p=proj(u.x,2.2,u.z),b=proj(u.x,0,u.z);if(!p||!b||p.z>350)return;ctx.strokeStyle='#5b5147';ctx.lineWidth=clamp(16/p.z,1,3);ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.fillStyle=u.c;ctx.beginPath();ctx.ellipse(p.x,p.y,clamp(160/p.z,3,22),clamp(55/p.z,2,9),0,Math.PI,Math.PI*2);ctx.fill()}
function drawCar(c){const cc=camPoint(c.x,1,c.z);if(cc.z<1||cc.z>350)return;drawBuilding({x:c.x,z:c.z,w:1.9,d:4.2,h:1.15,c:c.c,glass:false})}
function render(){drawBackground();drawGround();const items=[];for(const b of buildings){const c=camPoint(b.x,b.h*.5,b.z);if(c.z>0&&c.z<540)items.push({d:c.z,type:'b',o:b})}for(const p of palms){const c=camPoint(p.x,4,p.z);if(c.z>0&&c.z<480)items.push({d:c.z,type:'p',o:p})}for(const u of umbrellas){const c=camPoint(u.x,1,u.z);if(c.z>0&&c.z<360)items.push({d:c.z,type:'u',o:u})}for(const c of cars){const q=camPoint(c.x,1,c.z);if(q.z>0&&q.z<360)items.push({d:q.z,type:'c',o:c})}items.sort((a,b)=>b.d-a.d);for(const it of items){if(it.type==='b')drawBuilding(it.o);else if(it.type==='p')drawPalm(it.o);else if(it.type==='u')drawUmbrella(it.o);else drawCar(it.o)}drawWeapon();}
function drawWeapon(){const bob=(Math.abs(moveX)+Math.abs(moveY)>.1)?Math.sin(time*9)*4:Math.sin(time*2)*1.3;const r=player.recoil;ctx.save();ctx.translate(W*.71,H*.82+bob+r*18);ctx.rotate(-.08-r*.07);ctx.fillStyle='#161a20';ctx.beginPath();ctx.roundRect(0,0,Math.min(150,W*.25),28,7);ctx.fill();ctx.fillStyle='#2b3037';ctx.beginPath();ctx.roundRect(18,19,30,58,7);ctx.fill();ctx.fillStyle='#07090c';ctx.fillRect(Math.min(145,W*.24),7,36,10);if(player.recoil>.55){let g=ctx.createRadialGradient(Math.min(185,W*.29),12,2,Math.min(185,W*.29),12,28);g.addColorStop(0,'rgba(255,248,194,1)');g.addColorStop(.3,'rgba(255,170,67,.85)');g.addColorStop(1,'rgba(255,126,32,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(Math.min(185,W*.29),12,30,0,Math.PI*2);ctx.fill()}ctx.restore()}
function collides(x,z){const r=.55;for(const b of buildings){let cx=clamp(x,b.x-b.w/2,b.x+b.w/2),cz=clamp(z,b.z-b.d/2,b.z+b.d/2),dx=x-cx,dz=z-cz;if(dx*dx+dz*dz<r*r)return true}return false}
function update(dt){time+=dt;fireCd=Math.max(0,fireCd-dt);player.recoil=Math.max(0,player.recoil-dt*5.8);const sp=sprinting?10.5:6.2,sy=Math.sin(player.yaw),cy=Math.cos(player.yaw),rx=cy,rz=-sy;let dx=sy*(-moveY)+rx*moveX,dz=cy*(-moveY)+rz*moveX,l=Math.hypot(dx,dz);if(l>1){dx/=l;dz/=l}let nx=player.x+dx*sp*dt,nz=player.z+dz*sp*dt;if(!collides(nx,player.z))player.x=nx;if(!collides(player.x,nz))player.z=nz;player.vy-=18*dt;player.y+=player.vy*dt;if(player.y<=1){player.y=1;player.vy=0;player.grounded=true}player.x=Math.max(-205,player.x);for(const c of cars){c.z+=c.s*c.dir*dt;if(c.z>115)c.z=-480;if(c.z<-480)c.z=115}frameCount++;fpsTime+=dt;if(fpsTime>.7){fpsEl.textContent=Math.round(frameCount/fpsTime)+' FPS';frameCount=0;fpsTime=0}}
function fire(){if(fireCd>0)return;if(player.ammo<=0){toastMsg('RELOAD');return}player.ammo--;ammoEl.textContent=player.ammo;fireCd=.12;player.recoil=1;}
function loop(ts){if(!started)return;let dt=Math.min((ts-last)/1000||.016,.035);last=ts;update(dt);render();requestAnimationFrame(loop)}
function setupControls(){const joy=document.getElementById('joy'),stick=document.getElementById('stick'),look=document.getElementById('look');let jid=null,cx=0,cy=0;function jmove(e){let dx=e.clientX-cx,dy=e.clientY-cy,l=Math.hypot(dx,dy)||1,k=Math.min(1,38/l);dx*=k;dy*=k;moveX=dx/38;moveY=dy/38;stick.style.transform=`translate(${dx}px,${dy}px)`}joy.addEventListener('pointerdown',e=>{jid=e.pointerId;joy.setPointerCapture(e.pointerId);let r=joy.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;jmove(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)jmove(e)});function je(e){if(e.pointerId!==jid)return;jid=null;moveX=moveY=0;stick.style.transform='translate(0,0)'}joy.addEventListener('pointerup',je);joy.addEventListener('pointercancel',je);let lid=null,lx=0,ly=0;look.addEventListener('pointerdown',e=>{lid=e.pointerId;lx=e.clientX;ly=e.clientY;look.setPointerCapture(e.pointerId)});look.addEventListener('pointermove',e=>{if(e.pointerId!==lid)return;let dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;player.yaw+=dx*.006;player.pitch=clamp(player.pitch-dy*.0045,-.34,.25)});function le(e){if(e.pointerId===lid)lid=null}look.addEventListener('pointerup',le);look.addEventListener('pointercancel',le);const fireB=document.getElementById('fire');let firing=false;fireB.addEventListener('pointerdown',e=>{e.preventDefault();firing=true;fire();let f=()=>{if(!firing)return;fire();setTimeout(f,85)};setTimeout(f,85)});['pointerup','pointercancel'].forEach(n=>fireB.addEventListener(n,()=>firing=false));document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();if(player.grounded){player.vy=7.2;player.grounded=false}});const run=document.getElementById('run');run.addEventListener('pointerdown',e=>{e.preventDefault();sprinting=true});['pointerup','pointercancel'].forEach(n=>run.addEventListener(n,()=>sprinting=false));document.getElementById('reload').addEventListener('pointerdown',e=>{e.preventDefault();player.ammo=24;ammoEl.textContent=24;toastMsg('RELOADED')});document.getElementById('view').addEventListener('pointerdown',e=>{e.preventDefault();firstPerson=!firstPerson;toastMsg(firstPerson?'FIRST PERSON':'OVER-SHOULDER')})}
function startGame(e){if(e){e.preventDefault();e.stopPropagation()}if(started)return;try{status.textContent='Starting…';initWorld();setupControls();started=true;start.style.display='none';hud.style.display='block';last=performance.now();requestAnimationFrame(loop);toastMsg('Swipe the right side to look')}catch(err){console.error(err);status.textContent='Start error: '+err.message}}
play.addEventListener('click',startGame,{passive:false});play.addEventListener('touchend',startGame,{passive:false});play.addEventListener('pointerup',startGame,{passive:false});
})();
</script></body></html>
